<!-- ============================================
     HomeFinder Ghana — Responsive Header (v3)
     Enhanced with an earlier drawer breakpoint (1024px)
     to completely eliminate nav link crowding on tablets
     and medium screens.
     ============================================ -->

<header class="site-header">
    <div class="header-inner">

        <a href="{% url 'home_finder:home' %}" class="logo">
            <span class="logo-icon">
                <i class="fa-solid fa-house"></i>
            </span>
            <span class="logo-text">HomeFinder <span class="logo-accent">GHANA</span></span>
        </a>

        <nav class="nav-drawer" id="navDrawer">
            <div class="nav-drawer-head">
                <span class="nav-drawer-title">Menu</span>
                <button type="button" class="icon-btn nav-drawer-close" id="navClose" aria-label="Close menu">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <ul class="nav-links">
                <li><a href="{% url 'home_finder:home' %}" class="active">Home</a></li>
                <li><a href="#">Properties</a></li>
                <li><a href="#">How It Works</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <div class="nav-drawer-actions">
                <a href="{% url 'account:login' %}" class="btn btn-outline">Login</a>
                <a href="{% url 'account:register' %}" class="btn btn-primary">Sign Up</a>
            </div>
        </nav>

        <div class="nav-actions">
            <button type="button" class="icon-btn wishlist-icon" aria-label="Wishlist">
                <i class="fa-regular fa-heart"></i>
            </button>

            <a href="{% url 'account:login' %}" class="btn btn-outline btn-desktop">Login</a>
            <a href="{% url 'account:register' %}" class="btn btn-primary btn-desktop">Sign Up</a>

            <button type="button" class="icon-btn menu-toggle" id="menuToggle"
                    aria-label="Open menu" aria-expanded="false" aria-controls="navDrawer">
                <span class="menu-bar"></span>
                <span class="menu-bar"></span>
                <span class="menu-bar"></span>
            </button>
        </div>

    </div>
</header>

<div class="nav-overlay" id="navOverlay"></div>

<style>
    /* ---------- Palette ---------- */
    :root {
        --color-navy: #14213d;
        --color-navy-light: #1f3157;
        --color-gold: #e8a33d;
        --color-gold-dark: #cf8c28;
        --color-bg: #ffffff;
        --color-border: #e9ebef;
        --color-text: #14213d;
        --color-text-muted: #5a6478;

        --header-h-desktop: 76px;
        --header-h-tablet: 68px;
        --header-h-mobile: 60px;
        --max-width: 1280px;
    }

    * { box-sizing: border-box; }

    .site-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        width: 100%;
        background: var(--color-bg);
        border-bottom: 1px solid var(--color-border);
    }

    .header-inner {
        max-width: var(--max-width);
        margin: 0 auto;
        height: var(--header-h-desktop);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: clamp(16px, 2.5vw, 32px);
        padding: 0 clamp(16px, 4vw, 40px);
    }

    /* ---------- Logo ---------- */
    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--color-text);
        font-weight: 700;
        font-size: clamp(1rem, 1.4vw + 0.4rem, 1.25rem);
        white-space: nowrap;
        flex-shrink: 0;
        min-width: 0;
    }

    .logo-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        min-width: 38px;
        border-radius: 10px;
        background: var(--color-navy);
        color: var(--color-gold);
        font-size: 1rem;
    }

    .logo-text {
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .logo-accent {
        color: var(--color-gold-dark);
        font-weight: 800;
        letter-spacing: 0.03em;
    }

    /* ---------- Nav drawer (inline on desktop, slide-in on screens <= 1024px) ---------- */
    .nav-drawer-head,
    .nav-drawer-close { display: none; }

    .nav-drawer {
        display: flex;
        align-items: center;
        flex: 1;
        justify-content: center;
        min-width: 0;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(14px, 1.8vw, 26px);
        list-style: none;
        margin: 0;
        padding: 0;
        flex-wrap: nowrap;
    }

    .nav-links a {
        display: inline-block;
        text-decoration: none;
        color: var(--color-text-muted);
        font-size: 0.95rem;
        font-weight: 500;
        position: relative;
        padding: 6px 2px;
        white-space: nowrap;
        transition: color 0.15s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
        color: var(--color-navy);
    }

    .nav-links a.active {
        color: var(--color-navy);
        font-weight: 700;
    }

    .nav-links a.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -4px;
        height: 2px;
        background: var(--color-gold);
        border-radius: 2px;
    }

    .nav-drawer-actions { display: none; }

    /* ---------- Right side actions ---------- */
    .nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }

    .icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        min-width: 40px;
        border-radius: 10px;
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-navy);
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover { background: #f5f6f8; border-color: #d8dbe2; }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        border: 1px solid transparent;
        transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-outline {
        color: var(--color-navy);
        border-color: var(--color-border);
        background: transparent;
    }
    .btn-outline:hover { border-color: var(--color-navy); }

    .btn-primary {
        background: var(--color-gold);
        color: var(--color-navy);
    }
    .btn-primary:hover {
        background: var(--color-gold-dark);
        box-shadow: 0 4px 14px rgba(232, 163, 61, 0.35);
    }

    .btn:active { transform: translateY(1px); }

    /* ---------- Hamburger ---------- */
    .menu-toggle {
        display: none;
        flex-direction: column;
        gap: 4px;
    }

    .menu-bar {
        width: 20px;
        height: 2px;
        background: var(--color-navy);
        border-radius: 2px;
        transition: transform 0.25s ease, opacity 0.2s ease;
    }

    .nav-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(20, 33, 61, 0.35);
        z-index: 998;
        opacity: 0;
        transition: opacity 0.25s ease;
    }
    .nav-overlay.visible { display: block; opacity: 1; }

    /* =========================================================
       ≤1024px — Tablets and small screens: collapse nav drawer
       earlier to completely avoid link crowding.
       ========================================================= */
    @media (max-width: 1024px) {
        .header-inner { height: var(--header-h-tablet); }

        .nav-drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100dvh;
            width: min(320px, 88vw);
            background: var(--color-bg);
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 999;
            box-shadow: -8px 0 24px rgba(20, 33, 61, 0.1);
            overflow-y: auto;
            padding-bottom: 24px;
        }

        .nav-drawer.open { transform: translateX(0); }

        .nav-drawer-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--color-border);
        }

        .nav-drawer-title {
            font-weight: 700;
            color: var(--color-navy);
        }

        .nav-drawer-close {
            display: flex;
            width: 34px;
            height: 34px;
            min-width: 34px;
        }

        .nav-links {
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
            width: 100%;
            padding: 8px 20px;
        }

        .nav-links li { width: 100%; }

        .nav-links a {
            display: block;
            width: 100%;
            padding: 13px 2px;
            font-size: 1rem;
            border-bottom: 1px solid var(--color-border);
        }

        .nav-links a.active::after { display: none; }

        .nav-drawer-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
        }

        .nav-drawer-actions .btn { width: 100%; padding: 12px; font-size: 0.95rem; }

        .btn-desktop { display: none; }
        .menu-toggle { display: flex; }
    }

    /* =========================================================
       ≤560px — Phones: trim padding, scale down elements
       ========================================================= */
    @media (max-width: 560px) {
        .header-inner { height: var(--header-h-mobile); padding: 0 14px; gap: 8px; }
        .logo-icon { width: 34px; height: 34px; min-width: 34px; font-size: 0.9rem; }
        .logo-text { max-width: 44vw; }
    }

    /* =========================================================
       ≤380px — Tiny screens: hide wishlist icon to preserve space
       ========================================================= */
    @media (max-width: 380px) {
        .wishlist-icon { display: none; }
        .icon-btn { width: 36px; height: 36px; min-width: 36px; }
    }

    /* ---------- Accessibility & Motion ---------- */
    .menu-toggle[aria-expanded="true"] .menu-bar:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] .menu-bar:nth-child(2) { opacity: 0; }
    .menu-toggle[aria-expanded="true"] .menu-bar:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .icon-btn:focus-visible,
    .btn:focus-visible,
    .nav-links a:focus-visible {
        outline: 2px solid var(--color-gold);
        outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
        .nav-drawer, .menu-bar, .nav-overlay, .btn { transition: none; }
    }
</style>

<script>
    (function () {
        const toggle = document.getElementById('menuToggle');
        const closeBtn = document.getElementById('navClose');
        const drawer = document.getElementById('navDrawer');
        const overlay = document.getElementById('navOverlay');

        function closeMenu() {
            drawer.classList.remove('open');
            overlay.classList.remove('visible');
            toggle.setAttribute('aria-expanded', 'false');
            document.body.style.overflow = '';
        }

        function openMenu() {
            drawer.classList.add('open');
            overlay.classList.add('visible');
            toggle.setAttribute('aria-expanded', 'true');
            document.body.style.overflow = 'hidden';
        }

        toggle.addEventListener('click', function () {
            drawer.classList.contains('open') ? closeMenu() : openMenu();
        });

        closeBtn.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeMenu();
        });

        window.addEventListener('resize', function () {
            if (window.innerWidth > 1024) closeMenu();
        });
    })();
</script>
